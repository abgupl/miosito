Portami qualsiasi cosa: un problema difficile, un’idea abbozzata, qualcosa che devi scrivere. Lo risolveremo insieme.

Da dove vuoi iniziare?

Confermato, è esattamente come sospettavo: la cartella .github/workflows/ non è mai stata caricata. La aggiungiamo direttamente da browser, senza dover ricaricare tutto.

1
Clicca "Add file" > "Create new file"
Nella pagina principale del repository, clicca sul pulsante "Add file" (in alto a destra, vicino a "Code") e scegli "Create new file".
2
Scrivi il percorso completo nel nome del file
Nel campo del nome file, scrivi tutto questo insieme (GitHub creerà automaticamente le cartelle): .github/workflows/post_offers.yml
3
Incolla il contenuto del workflow
Copia il contenuto del file post_offers.yml (quello dello zip che ti ho dato) e incollalo nell'editor che appare sotto.
4
Salva con "Commit changes"
Scorri in basso e clicca il pulsante verde "Commit changes" (o "Commit new file") per salvare.
Ecco il contenuto esatto da incollare nell'editor:

yaml
name: Pubblica offerte Amazon su Telegram

on:
  schedule:
    # Ogni 4 ore. Modifica il cron se vuoi un'altra frequenza.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}  # ti permette anche di lanciarlo manualmente da GitHub

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Esegui il bot
        env:
          AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
Dopo aver salvato, torna sulla tab Actions: questa volta dovresti vedere "Pubblica offerte Amazon su Telegram" nella lista, con il pulsante "Run workflow" disponibile. Mentre sei lì, verifica anche che gli altri file (bot.py, config.py, amazon_client.py, telegram_client.py, requirements.txt) siano effettivamente presenti nella root del repository — con lo stesso problema del drag-and-drop potrebbero mancarne altri.

